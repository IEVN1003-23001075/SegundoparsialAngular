<!-- Formulario -->
<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">

  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Registro de alumnos
  </h1>

  <form
    [formGroup]="formulario"
    (ngSubmit)="muestraAlumno()"
  >

    <!-- Matrícula -->
    <div class="mb-5">
      <label
        for="matricula"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Matrícula
      </label>

      <input
        type="text"
        id="matricula"
        formControlName="matricula"
        required
        placeholder="Escribe tu matrícula"
        class="bg-gray-50 border border-gray-300 text-gray-900
               text-sm rounded-lg block w-full p-2.5
               focus:ring-blue-500 focus:border-blue-500"
      >
    </div>

    <!-- Nombre -->
    <div class="mb-5">
      <label
        for="nombre"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Nombre
      </label>

      <input
        type="text"
        id="nombre"
        formControlName="nombre"
        required
        placeholder="Escribe tu nombre completo"
        class="bg-gray-50 border border-gray-300 text-gray-900
               text-sm rounded-lg block w-full p-2.5
               focus:ring-blue-500 focus:border-blue-500"
      >
    </div>

    <!-- Correo -->
    <div class="mb-5">
      <label
        for="correo"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Correo electrónico
      </label>

      <input
        type="email"
        id="correo"
        formControlName="correo"
        required
        email
        placeholder="Escribe tu correo electrónico"
        class="bg-gray-50 border border-gray-300 text-gray-900
               text-sm rounded-lg block w-full p-2.5
               focus:ring-blue-500 focus:border-blue-500"
      >
    </div>

    <!-- Materia -->
    <div class="mb-5">
      <label
        for="materia"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Materia
      </label>

      <input
        type="text"
        id="materia"
        formControlName="materia"
        required
        placeholder="Escribe la materia"
        class="bg-gray-50 border border-gray-300 text-gray-900
               text-sm rounded-lg block w-full p-2.5
               focus:ring-blue-500 focus:border-blue-500"
      >
    </div>

    <p
      *ngIf="formulario.touched && formulario.invalid"
      class="mb-4 text-sm text-red-700"
      role="alert"
    >
      Completa todos los campos y escribe un correo válido.
    </p>

    <button
      type="submit"
      class="text-white bg-blue-700 hover:bg-blue-800
             font-medium rounded-lg text-sm px-5 py-2.5"
    >
      {{ indiceEditar === -1 ? 'Registrar' : 'Guardar cambios' }}
    </button>

    <button
      type="button"
      (click)="mostrarAlumnos()"
      class="ml-2 text-white bg-gray-700 hover:bg-gray-800
             font-medium rounded-lg text-sm px-5 py-2.5"
    >
      Cargar alumnos
    </button>

  </form>

</div>

<!-- Tabla del profesor -->
<div
  *ngIf="mostrarAlumno"
  class="max-w-6xl mx-auto mt-8"
>

  <h2 class="mb-4 text-2xl font-bold text-gray-900">
    Lista de alumnos
  </h2>

  <div class="relative overflow-x-auto shadow-md sm:rounded-lg">

    <table class="w-full text-sm text-left text-gray-500">

      <!-- Encabezado -->
      <thead class="text-xs text-gray-700 uppercase bg-gray-100">
        <tr>
          <th scope="col" class="px-6 py-3">
            Matrícula
          </th>

          <th scope="col" class="px-6 py-3">
            Nombre
          </th>

          <th scope="col" class="px-6 py-3">
            Correo
          </th>

          <th scope="col" class="px-6 py-3">
            Materia
          </th>

          <th scope="col" class="px-6 py-3">
            Acciones
          </th>
        </tr>
      </thead>

      <!-- Datos -->
      <tbody>
        <tr
          *ngFor="let alumno1 of alumnos; let i = index"
          class="bg-white border-b border-gray-200 hover:bg-gray-50"
        >

          <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">
            {{ alumno1.matricula }}
          </td>

          <td class="px-6 py-4">
            {{ alumno1.nombre }}
          </td>

          <td class="px-6 py-4">
            {{ alumno1.correo }}
          </td>

          <td class="px-6 py-4">
            {{ alumno1.materia }}
          </td>

          <td class="px-6 py-4">
            <div class="flex gap-2">

              <!-- Botón Editar -->
              <button
                type="button"
                class="px-4 py-2 text-sm font-medium text-white
                       bg-green-600 rounded-lg hover:bg-green-700
                       focus:ring-4 focus:outline-none focus:ring-green-300"
                (click)="editarAlumno(i)"
              >
                Editar
              </button>

              <!-- Botón Eliminar -->
              <button
                type="button"
                class="px-4 py-2 text-sm font-medium text-white
                       bg-red-600 rounded-lg hover:bg-red-700
                       focus:ring-4 focus:outline-none focus:ring-red-300"
                (click)="eliminarAlumno(i)"
              >
                Eliminar
              </button>

            </div>
          </td>

        </tr>
      </tbody>

    </table>

  </div>

  <!-- Mensaje cuando no existen alumnos -->
  <div
    *ngIf="alumnos.length === 0"
    class="p-4 mt-4 text-sm text-gray-800 rounded-lg bg-gray-100"
    role="alert"
  >
    <span class="font-medium">Información:</span>
    No hay alumnos registrados.
  </div>

</div>
