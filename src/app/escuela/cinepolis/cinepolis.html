
<div class="max-w-4xl mx-auto bg-white text-black rounded-xl shadow-lg p-6 md:p-8 font-sans">

  <h1 class="text-4xl text-center mb-8">
    Cinépolis
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Entradas -->
    <div>
      <h2 class="text-2xl mb-3">Entradas</h2>

      <div class="border border-gray-300 rounded-lg p-5">

        <div class="mb-4">
          <label for="nombre" class="block mb-2">
            Nombre
          </label>

          <input
            type="text"
            id="nombre"
            name="nombre"
            [(ngModel)]="nombre"
            class="w-full bg-white text-black border border-gray-300 rounded-lg p-2"
          >
        </div>

        <div class="mb-4">
          <label for="compradores" class="block mb-2">
            Cantidad de compradores
          </label>

          <input
            type="number"
            id="compradores"
            name="compradores"
            min="1"
            step="1"
            [(ngModel)]="compradores"
            class="w-full bg-white text-black border border-gray-300 rounded-lg p-2"
          >
        </div>

        <div class="mb-4">
          <p class="mb-2">Tarjeta Cineco</p>

          <div class="flex gap-6">
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="radio"
                name="tarjeta"
                value="si"
                [(ngModel)]="tarjeta"
              >
              Sí
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="radio"
                name="tarjeta"
                value="no"
                [(ngModel)]="tarjeta"
              >
              No
            </label>
          </div>

          <p class="mt-3">
            Opción seleccionada:
            {{ tarjeta === 'si' ? 'Sí' : 'No' }}
          </p>
        </div>

        <div>
          <label for="boletos" class="block mb-2">
            Cantidad de boletos
          </label>

          <input
            type="number"
            id="boletos"
            name="boletos"
            min="1"
            step="1"
            [(ngModel)]="boletos"
            class="w-full bg-white text-black border border-gray-300 rounded-lg p-2"
          >
        </div>

      </div>
    </div>

    <!-- Salidas -->
    <div>
      <h2 class="text-2xl mb-3">Salidas</h2>

      <div class="border border-gray-300 rounded-lg p-5">

        <label for="total" class="block mb-2">
          Valor a pagar
        </label>

        <input
          type="text"
          id="total"
          readonly
          [value]="mostrarResultado ? '$' + total.toFixed(2) : ''"
          class="w-full bg-white text-black border border-gray-300 rounded-lg p-2"
        >

        @if (mostrarResultado) {
          <p class="mt-4">
            Comprador: {{ nombre }}
          </p>
        }

        @if (mensaje !== '') {
          <div
            class="mt-4 border border-gray-300 rounded-lg p-3"
            role="alert"
          >
            {{ mensaje }}
          </div>
        }

      </div>
    </div>

  </div>

  <!-- Identidad del cine -->
  <div class="text-center my-10">
    <p class="text-5xl md:text-6xl">Cinépolis</p>
    <p class="mt-3">LA CAPITAL DEL CINE</p>
  </div>

  <!-- Acciones -->
  <div class="max-w-lg mx-auto">
    <h2 class="text-2xl mb-3">Acciones</h2>

    <div class="border border-gray-300 rounded-lg p-5">
      <div class="flex flex-wrap justify-center gap-4">

        <button
          type="button"
          (click)="procesar()"
          class="bg-white text-black border border-gray-300 rounded-lg px-5 py-2 hover:bg-gray-100"
        >
          {{ indiceEditar === -1 ? 'Procesar' : 'Guardar cambios' }}
        </button>

        <button
          type="button"
          (click)="verVentas()"
          class="bg-white text-black border border-gray-300 rounded-lg px-5 py-2 hover:bg-gray-100"
        >
          Ver ventas
        </button>

        <button
          type="button"
          (click)="salir()"
          class="bg-white text-black border border-gray-300 rounded-lg px-5 py-2 hover:bg-gray-100"
        >
          Salir
        </button>

      </div>
    </div>
  </div>

</div>
