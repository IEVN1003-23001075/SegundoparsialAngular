
<div class="min-h-screen bg-slate-950 text-white p-6">

  <div class="max-w-3xl mx-auto">

    <!-- Encabezado -->
    <div class="mb-8">
      <a
        routerLink="/utl/maestros"
        class="text-blue-400 hover:text-blue-300 transition">
        ← Volver a maestros
      </a>

      <h1 class="text-3xl font-bold mt-4">
        Agregar maestro
      </h1>

      <p class="text-slate-400 mt-2">
        Completa la información para registrar un nuevo maestro.
      </p>
    </div>

    <!-- Formulario -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">

      <form #formulario="ngForm"
        (ngSubmit)="agregarMaestro(formulario)">

        <!-- Nombre -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-300 mb-2">
            Nombre
          </label>

          <input
            type="text"
            name="nombre"
            [(ngModel)]="maestro.nombre"
            required
            maxlength="50"
            placeholder="Ingresa el nombre"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Apellido paterno -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-300 mb-2">
            Apellido paterno
          </label>

          <input
            type="text"
            name="apaterno"
            [(ngModel)]="maestro.apaterno"
            required
            maxlength="50"
            placeholder="Ingresa el apellido paterno"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Apellido materno -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-300 mb-2">
            Apellido materno
          </label>

          <input
            type="text"
            name="amaterno"
            [(ngModel)]="maestro.amaterno"
            required
            maxlength="50"
            placeholder="Ingresa el apellido materno"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Correo -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-slate-300 mb-2">
            Correo electrónico
          </label>

          <input
            type="email"
            name="correo"
            [(ngModel)]="maestro.correo"
            required
            maxlength="50"
            email
            placeholder="ejemplo@utleon.edu.mx"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Mensajes -->
        <div *ngIf="error"
          class="bg-red-950/40 border border-red-800 text-red-300 rounded-lg p-3 mb-5">
          {{ error }}
        </div>

        <div *ngIf="mensaje"
          class="bg-green-950/40 border border-green-800 text-green-300 rounded-lg p-3 mb-5">
          {{ mensaje }}
        </div>

        <!-- Botones -->
        <div class="flex flex-col sm:flex-row justify-end gap-3">

          <a
            routerLink="/utl/maestros"
            class="text-center bg-slate-700 hover:bg-slate-600 text-white px-5 py-3 rounded-lg transition">
            Cancelar
          </a>

          <button
            type="submit"
            [disabled]="guardando || formulario.invalid"
            class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-700 disabled:text-slate-400 text-white font-semibold px-5 py-3 rounded-lg transition">
            {{ guardando ? 'Guardando...' : 'Registrar maestro' }}
          </button>

        </div>

      </form>

    </div>

  </div>

</div>
