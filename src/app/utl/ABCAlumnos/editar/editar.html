
<div class="max-w-2xl mx-auto p-6 bg-white border border-gray-200 rounded-xl shadow-sm">

  <h1 class="text-2xl font-bold text-gray-900 mb-2">
    Editar alumno
  </h1>

  <p class="text-sm text-gray-500 mb-6">
    Modifica la información del alumno seleccionado.
  </p>

  <div *ngIf="cargando" class="text-center p-5">
    Cargando información...
  </div>

  <div *ngIf="!cargando && alumno.matricula">

    <form (ngSubmit)="actualizarAlumno()">

      <div class="mb-4">
        <label class="block mb-2 text-sm font-medium">
          Matrícula
        </label>

        <input
          type="text"
          name="matricula"
          [(ngModel)]="alumno.matricula"
          readonly
          class="w-full p-2.5 border border-gray-300 rounded-lg bg-gray-100">
      </div>

      <div class="mb-4">
        <label class="block mb-2 text-sm font-medium">
          Nombre
        </label>

        <input
          type="text"
          name="nombre"
          [(ngModel)]="alumno.nombre"
          required
          class="w-full p-2.5 border border-gray-300 rounded-lg">
      </div>

      <div class="mb-4">
        <label class="block mb-2 text-sm font-medium">
          Apellido paterno
        </label>

        <input
          type="text"
          name="apaterno"
          [(ngModel)]="alumno.apaterno"
          required
          class="w-full p-2.5 border border-gray-300 rounded-lg">
      </div>

      <div class="mb-4">
        <label class="block mb-2 text-sm font-medium">
          Apellido materno
        </label>

        <input
          type="text"
          name="amaterno"
          [(ngModel)]="alumno.amaterno"
          required
          class="w-full p-2.5 border border-gray-300 rounded-lg">
      </div>

      <div class="mb-5">
        <label class="block mb-2 text-sm font-medium">
          Correo electrónico
        </label>

        <input
          type="email"
          name="correo"
          [(ngModel)]="alumno.correo"
          required
          email
          class="w-full p-2.5 border border-gray-300 rounded-lg">
      </div>

      <p *ngIf="error" class="mb-4 text-sm text-red-600">
        {{error}}
      </p>

      <div class="flex justify-end gap-3">

        <button
          type="button"
          (click)="cancelar()"
          class="px-5 py-2.5 border rounded-lg">
          Cancelar
        </button>

        <button
          type="submit"
          [disabled]="guardando"
          class="px-5 py-2.5 text-white bg-blue-700 rounded-lg disabled:opacity-50">
          {{guardando ? 'Actualizando...' : 'Guardar cambios'}}
        </button>

      </div>

    </form>

  </div>

  <p *ngIf="!cargando && error && !alumno.matricula"
    class="text-red-600">
    {{error}}
  </p>

</div>
